<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0c1d33">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Ardu Snowball · Arduino UNO Q</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2300a9ae'/%3E%3Ctext x='32' y='44' font-size='26' font-family='Arial Black,Arial' font-weight='900' text-anchor='middle' fill='white'%3EAS%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body data-screen="boot">
  <canvas id="game"></canvas>
  <div id="hud" class="hidden"></div>
  <div id="menus" class="hidden"></div>
  <div id="toast"></div>
  <div id="fps" class="hidden"></div>

  <div id="touch" class="hidden">
    <div class="t-look"></div>
    <div class="t-stick"><div class="t-knob"></div><span>MOVE</span></div>
    <div class="t-btns">
      <div class="t-run">RUN</div>
      <div class="t-snow">SNOW</div>
      <div class="t-throw">❄</div>
    </div>
    <div class="t-pause" onclick="window.ardusnow && window.ardusnow.pause()">❚❚</div>
  </div>

  <a id="ei-logo" href="https://edgeimpulse.com" target="_blank" rel="noopener"><img src="img/edge-impulse-logo.png" alt="Edge Impulse, a Qualcomm company"></a>

  <div id="loader">
    <div class="loader-logo"><span class="logo-ardu">ARDU</span><span class="logo-kart">SNOWBALL</span></div>
    <div class="loader-track"><div id="loader-bar"></div></div>
    <div id="loader-label">Waiting for snow…</div>
  </div>

  <noscript>Ardu Snowball needs JavaScript and WebGL.</noscript>
  <script src="libs/socket.io.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
